name = "submit"
main = "index.mjs"
compatibility_date = "2026-11-05"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://hyperbolica-dev.github.io"
DAILY_SUBMISSION_LIMIT = "1000"

[[ratelimits]]
name = "SUBMIT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[durable_objects.bindings]]
name = "SUBMISSION_LEDGER"
class_name = "SubmissionLedger"

[[migrations]]
tag = "v1-submission-ledger"
new_sqlite_classes = ["SubmissionLedger"]

[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "32f49622cbf547659d4791868bd1b1d1"

# Stats tokens occur in query strings. Do not enable invocation logging here.
[observability]
enabled = false
