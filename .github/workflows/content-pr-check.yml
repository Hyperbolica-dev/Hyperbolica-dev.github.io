name: Check content pull request

on:
  pull_request:
    paths:
      - src/content/docs/**
      - src/content.config.ts
      - src/lib/**
      - package.json
      - package-lock.json
      - astro.config.mjs
      - .github/workflows/content-pr-check.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site and search index
        run: npm run build
